name: fetch-live-prices

# Appends a daily price snapshot so the live CPI index has a chain to measure
# along. Streamlit Cloud's filesystem is ephemeral, so a snapshot written by
# the deployed app disappears on the next restart — only a job that can commit
# back to the repo makes the history accumulate.
#
# Daily at 06:30 IST (01:00 UTC), before Indian markets open, so each link
# spans a clean 24 hours rather than an arbitrary gap between two visitors
# happening to press the button.
#
# Outcomes:
#   snapshot appended -> commit
#   no source returned data -> no commit, no issue (sources fail transiently)
#   unexpected failure -> open an issue

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never let two runs race on the same file.
concurrency:
  group: fetch-live-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: systems/02-macro-pulse

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: systems/02-macro-pulse/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The path must match what scrapers/amazon.py forces at runtime. It
      # hard-codes /tmp/pw-browsers because Streamlit Cloud's home directory is
      # not writable; without the same value here, `playwright install` puts the
      # browser in ~/.cache and the scraper then looks somewhere else and finds
      # nothing. That is exactly what happened on the first run: "Executable
      # doesn't exist at /tmp/pw-browsers/..." — the grocery basket was silently
      # dropped from every snapshot while the job reported success.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers

      - name: Fetch prices
        id: fetch
        run: |
          set +e
          python scripts/fetch_live_prices.py
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case $rc in
            0) echo "status=appended" >> "$GITHUB_OUTPUT" ;;
            1) echo "status=nodata"   >> "$GITHUB_OUTPUT" ;;
            *) echo "status=fail"     >> "$GITHUB_OUTPUT" ;;
          esac
          echo "exit code: $rc"
        env:
          PYTHONPATH: ${{ github.workspace }}/systems/02-macro-pulse
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers

      - name: Commit snapshot
        if: steps.fetch.outputs.status == 'appended'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_snapshots.json data/measured_moms.json
          if git diff --cached --quiet; then
            echo "no diff to commit"
            exit 0
          fi
          git commit -m "data: live price snapshot ($(date -u +%Y-%m-%d))"
          # The MOSPI and RBI refresh jobs also push to main; rebase rather
          # than fail if one of them landed between our checkout and push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1

      - name: Open issue on failure
        if: steps.fetch.outputs.status == 'fail'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[live-prices] Fetch failed on ${today}`,
              body: [
                'The daily live-price fetch exited with an unexpected failure.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Note: "no source returned data" exits 1 and does NOT open an issue —',
                'price sources fail transiently and a missing day only shortens the',
                'chain. This issue means something genuinely broke.',
                '',
                'Likely causes:',
                '- a price API changed shape (check `scrapers/metals.py`)',
                '- both USD/INR providers unreachable, so bullion is skipped',
                '- an import error after a refactor',
              ].join('\n'),
              labels: ['data-pipeline', 'bug'],
            });
